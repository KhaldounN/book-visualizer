[server]
# A long novel is about 1-2 MB of text; refuse anything much bigger
maxUploadSize = 5

[client]
# no "Deploy" button: the site is meant to look like a finished website (the menu stays for the theme)
toolbarMode = "minimal"

[browser]
gatherUsageStats = false

[logger]
# Streamlit's welcome message looks up this computer's public address online
# (checkip.amazonaws.com) when it runs headless; run_website.ps1 prints the addresses instead
hideWelcomeMessage = true

# The look of a scholarly edition: an editorial serif (Newsreader) for headings, a clean
# sans (Inter) for text, warm paper with white "plates" for the figures, and one deep
# oxblood accent. Every brighter colour on the page belongs to a character, an emotion or the mood.
[theme]
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap, sans-serif"
headingFont = "Newsreader:https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400;1,6..72,500&display=swap, serif"
baseRadius = "0.25rem"
primaryColor = "#8a2b1f"

[theme.light]
backgroundColor = "#fbfaf6"
secondaryBackgroundColor = "#f2eee5"
textColor = "#1b1a17"

[theme.dark]
primaryColor = "#e0957a"
backgroundColor = "#121110"
secondaryBackgroundColor = "#1c1b19"
textColor = "#ece8df"
