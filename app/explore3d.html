<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600&family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* One 3D scene in a dark "hologram" stage. Filled in by app/explore3d.py:
   __DATA__ = the scene data (JSON), __SCENE__ = which scene to show. */
:root {
  color-scheme: dark;
  --void: #05080d; --line: #1b2a3a; --ink: #dbe7f3; --ink-2: #9fb0c4; --muted: #6c7d92;
  --holo: #5ee7ff; --holo-dim: rgba(94, 231, 255, 0.18);
  --display: "Chakra Petch", "Segoe UI", system-ui, sans-serif;
  --body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, monospace;
}
html, body { margin: 0; height: 100%; background: var(--void); color: var(--ink); font: 400 14px/1.5 var(--body); }
[hidden] { display: none !important; }  /* otherwise .card's display:grid would show hidden cards */
#stage {
  position: relative; height: 100%; overflow: hidden; border: 1px solid var(--line); border-radius: 4px;
  background: radial-gradient(120% 90% at 50% 100%, rgba(94, 231, 255, 0.07), transparent 60%), var(--void);
  box-sizing: border-box;
}
canvas { display: block; width: 100%; height: 100%; cursor: grab; }
canvas:active { cursor: grabbing; }
.hud { position: absolute; left: 12px; top: 12px; right: 12px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; pointer-events: none; }
.hud > * { pointer-events: auto; }
.chip { font: 500 12px/1 var(--mono); color: var(--ink-2); background: rgba(5, 8, 13, 0.8); border: 1px solid var(--line); padding: 7px 9px; border-radius: 3px; }
select, button { font: 500 13px/1 var(--display); color: var(--ink); background: rgba(11, 18, 28, 0.92); border: 1px solid var(--holo-dim); border-radius: 3px; padding: 8px 10px; }
button { cursor: pointer; }
button:hover, select:hover { border-color: var(--holo); }
:focus-visible { outline: 2px solid var(--holo); outline-offset: 2px; }
input[type="range"] { accent-color: var(--holo); width: min(260px, 45vw); }
.hint { position: absolute; right: 12px; bottom: 10px; font: 400 12px/1 var(--mono); color: var(--muted); pointer-events: none; }
.tip { position: absolute; pointer-events: none; background: rgba(5, 8, 13, 0.92); border: 1px solid var(--holo); padding: 8px 10px; border-radius: 3px; font: 400 13px/1.45 var(--body); transform: translate(12px, 12px); max-width: 240px; }
.tip b { font-family: var(--display); }
.card { position: absolute; left: 12px; bottom: 12px; width: min(250px, calc(100% - 24px)); background: rgba(5, 8, 13, 0.86); border: 1px solid var(--holo-dim); border-radius: 3px; padding: 12px; display: grid; gap: 8px; }
.card h3 { margin: 0; font: 600 17px/1.1 var(--display); color: var(--holo); }
.meta { font: 400 12px/1.4 var(--mono); color: var(--ink-2); }
.bars { display: grid; gap: 4px; }
.bar { display: grid; grid-template-columns: 88px 1fr 34px; gap: 6px; align-items: center; font: 400 12px/1 var(--mono); color: var(--ink-2); }
.bar s { display: block; height: 7px; border-radius: 1px; text-decoration: none; }
.bar em { font-style: normal; text-align: right; font-variant-numeric: tabular-nums; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 10px; font: 400 12px/1 var(--mono); color: var(--ink-2); }
.legend span { display: inline-flex; align-items: center; gap: 5px; }
.legend i { width: 9px; height: 9px; border-radius: 1px; display: inline-block; }
.error { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; padding: 24px; color: var(--ink-2); font: 400 14px/1.5 var(--body); }
</style>
</head>
<body>
<div id="stage">
  <canvas id="canvas" aria-label="3D view of the book"></canvas>
  <div class="hud" id="hud"></div>
  <div class="card" id="card" hidden></div>
  <div class="hint" id="hint">drag to rotate</div>
</div>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script>
  // If the scene hasn't started after 8 seconds (usually: no internet to load
  // the 3D library), say so instead of leaving a blank box
  setTimeout(() => {
    if (!window.sceneStarted) document.getElementById("stage").insertAdjacentHTML("beforeend",
      '<div class="error">The 3D view could not start. It needs an internet connection to load its graphics library.</div>');
  }, 8000);
</script>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const data = __DATA__;
const SCENE = "__SCENE__";
await document.fonts.ready;

const REDUCE = matchMedia("(prefers-reduced-motion: reduce)").matches;
const VOID = 0x05080d, HOLO = new THREE.Color("#5ee7ff");
const EMO = data.emotions, EMO_COLOR = data.emotionColors, EMO_LABEL = data.emotionLabels;
const NEG = new THREE.Color("#e66767"), MID = new THREE.Color("#4d5868"), POS = new THREE.Color("#3987e5");
const chars = data.characters;
const canvas = document.getElementById("canvas"), hud = document.getElementById("hud");
const card = document.getElementById("card"), hint = document.getElementById("hint");

// The emotion most above the book's average. (The biggest emotion is the
// same for almost everyone, e.g. disgust in Pride and Prejudice.)
const standsOut = (shares) => {
  const lift = shares.map((s, k) => s / Math.max(data.bookEmotions[k], 0.01));
  return EMO[lift.indexOf(Math.max(...lift))];
};
// Average each value with its neighbours (missing values are skipped)
const smooth = (values, w) => values.map((_, i) => {
  let sum = 0, n = 0;
  for (let j = i - w; j <= i + w; j++) if (values[j] != null) { sum += values[j]; n++; }
  return n ? sum / n : null;
});
const fmtTone = (t) => (t >= 0 ? "+" : "−") + Math.abs(t).toFixed(2);
function toneColor(t, range = 0.2) {
  if (t == null) return MID.clone().multiplyScalar(0.6);
  const x = Math.max(-1, Math.min(1, t / range));
  return x < 0 ? MID.clone().lerp(NEG, -x) : MID.clone().lerp(POS, x);
}
const escape = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);

/* ---- shared helpers ---- */
const glowTexture = (() => {
  const c = document.createElement("canvas"); c.width = c.height = 128;
  const g = c.getContext("2d"), r = g.createRadialGradient(64, 64, 0, 64, 64, 64);
  r.addColorStop(0, "rgba(255,255,255,1)"); r.addColorStop(0.22, "rgba(255,255,255,0.5)"); r.addColorStop(1, "rgba(255,255,255,0)");
  g.fillStyle = r; g.fillRect(0, 0, 128, 128);
  return new THREE.CanvasTexture(c);
})();
function glow(color, size) {
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTexture, color, blending: THREE.AdditiveBlending, transparent: true, depthWrite: false }));
  s.scale.setScalar(size); return s;
}
function label(text, { size = 0.55, color = "#dbe7f3", weight = 600, panel = null } = {}) {
  const c = document.createElement("canvas"), g = c.getContext("2d"), fs = 64, pad = panel ? 20 : 12;
  const font = `${weight} ${fs}px "Chakra Petch", sans-serif`;
  g.font = font; c.width = Math.ceil(g.measureText(text).width) + pad * 2; c.height = Math.round(fs * 1.35);
  if (panel) { g.fillStyle = panel; g.beginPath(); g.roundRect(0, 0, c.width, c.height, 12); g.fill(); }  // a tag behind the text
  g.font = font; g.fillStyle = color; g.textBaseline = "middle"; g.fillText(text, pad, c.height / 2);
  const tex = new THREE.CanvasTexture(c); tex.colorSpace = THREE.SRGBColorSpace;
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true, depthWrite: false }));
  s.scale.set(size * c.width / c.height, size, 1); return s;
}
// a round badge: a dark disc with a thin coloured ring and an emoji in the middle
function badge(emoji, ring, size) {
  const c = document.createElement("canvas"); c.width = c.height = 160;
  const g = c.getContext("2d");
  g.beginPath(); g.arc(80, 80, 70, 0, Math.PI * 2);
  g.fillStyle = "rgba(8, 13, 20, 0.94)"; g.fill();
  g.lineWidth = 7; g.strokeStyle = ring; g.stroke();
  g.font = '78px "Segoe UI Emoji", "Apple Color Emoji", "Noto Color Emoji", sans-serif';
  g.textAlign = "center"; g.textBaseline = "middle"; g.fillText(emoji, 80, 86);
  const tex = new THREE.CanvasTexture(c); tex.colorSpace = THREE.SRGBColorSpace;
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true, depthWrite: false }));
  s.scale.setScalar(size); return s;
}
function stage({ camera = [0, 4, 16], autoRotate = true, controls = true, fog = 0.018 } = {}) {
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2)); renderer.setClearColor(VOID);
  const scene = new THREE.Scene(); scene.fog = new THREE.FogExp2(VOID, fog);
  const cam = new THREE.PerspectiveCamera(48, 1, 0.1, 600); cam.position.set(...camera);
  let orbit = null;
  if (controls) {
    // no wheel zoom: the page around the scene should still scroll normally
    orbit = new OrbitControls(cam, canvas);
    orbit.enableDamping = true; orbit.enableZoom = false; orbit.enablePan = false;
    orbit.autoRotate = autoRotate && !REDUCE; orbit.autoRotateSpeed = 0.5;
    canvas.addEventListener("pointerdown", () => { orbit.autoRotate = false; }, { once: true });
  }
  const resize = () => { const w = canvas.clientWidth, h = canvas.clientHeight; renderer.setSize(w, h, false); cam.aspect = w / h; cam.updateProjectionMatrix(); };
  new ResizeObserver(resize).observe(canvas); resize();
  // The dashboard shows several 3D views on one page: only draw while this one
  // is on screen, so the others don't slow the computer down
  let onScreen = true;
  new IntersectionObserver(([entry]) => { onScreen = entry.isIntersecting; }).observe(canvas);
  const tick = [], clock = new THREE.Clock();
  renderer.setAnimationLoop(() => {
    if (document.hidden || !onScreen) return;
    const t = clock.getElapsedTime();
    orbit?.update(); tick.forEach((f) => f(t)); renderer.render(scene, cam);
  });
  return { scene, camera: cam, tick, orbit };
}
function hover(st, objects, describe) {
  const tip = document.createElement("div"); tip.className = "tip"; tip.hidden = true;
  document.getElementById("stage").appendChild(tip);
  const ray = new THREE.Raycaster(), p = new THREE.Vector2();
  const hit = (e) => {
    const r = canvas.getBoundingClientRect();
    p.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
    ray.setFromCamera(p, st.camera);
    return [ray.intersectObjects(objects(), false)[0], e.clientX - r.left, e.clientY - r.top];
  };
  canvas.addEventListener("pointermove", (e) => {
    const [h, x, y] = hit(e); const html = h && describe(h);
    tip.hidden = !html; if (html) { tip.innerHTML = html; tip.style.left = x + "px"; tip.style.top = y + "px"; }
  });
  canvas.addEventListener("pointerleave", () => { tip.hidden = true; });
  return hit;
}
function grid(size, divisions, y) {
  const g = new THREE.GridHelper(size, divisions, HOLO, HOLO);
  g.material.transparent = true; g.material.opacity = 0.09; g.position.y = y; return g;
}
function emotionBars(shares) {
  return `<div class="bars">${EMO.map((e, i) => `<div class="bar"><span>${EMO_LABEL[e]}</span><s style="width:${Math.min(100, Math.round(shares[i] * 260))}%;background:${EMO_COLOR[e]}"></s><em>${Math.round(shares[i] * 100)}%</em></div>`).join("")}</div>`;
}
// a character's avatar as a small round <img> (nothing for minor characters)
const avatarImg = (c, size = 30) => c && c.avatar ? `<img src="${c.avatar}" alt="" style="width:${size}px;height:${size}px;border-radius:50%;vertical-align:middle;margin-right:8px">` : "";
// "stands out: guilt, gratitude" (fine emotions above the book's average)
const standOut = (list) => list && list.length ? `<br><span style="color:var(--ink)">stands out: ${list.map(escape).join(", ")}</span>` : "";
function picker(labelText, options, onChange, start = 0) {
  const id = "pick";
  hud.insertAdjacentHTML("beforeend", `<label class="chip" for="${id}">${labelText}</label><select id="${id}"></select>`);
  const select = document.getElementById(id);
  options.forEach((text, i) => select.add(new Option(text, i)));
  select.value = String(start);
  select.addEventListener("change", () => onChange(+select.value));
  onChange(start);
}

/* ---- Landscapes for the Story road ---- */
// Low-poly pieces, each built standing on the ground at (0, 0, 0). A part with `tint`
// takes each copy's own colour; the others keep theirs (trunks, roofs, snow caps).
const part = (geo, y, color, tint = false) => { geo.translate(0, y, 0); return { geo, color, tint }; };
const PIECES = {
  pine: () => [part(new THREE.CylinderGeometry(0.06, 0.09, 0.5, 5), 0.25, 0x5a3f2a), part(new THREE.ConeGeometry(0.45, 1.3, 7), 1.1, 0, true)],
  snowpine: () => [part(new THREE.CylinderGeometry(0.06, 0.09, 0.5, 5), 0.25, 0x5a3f2a), part(new THREE.ConeGeometry(0.45, 1.3, 7), 1.1, 0, true)],
  roundtree: () => [part(new THREE.CylinderGeometry(0.07, 0.1, 0.7, 5), 0.35, 0x5a3f2a), part(new THREE.IcosahedronGeometry(0.48, 0), 0.95, 0, true)],
  bush: () => [part(new THREE.IcosahedronGeometry(0.3, 0), 0.18, 0, true)],
  house: () => {
    const roof = new THREE.ConeGeometry(0.68, 0.5, 4); roof.rotateY(Math.PI / 4);
    return [part(new THREE.BoxGeometry(0.9, 0.7, 0.9), 0.35, 0, true), part(roof, 0.95, 0x8a3b2e)];
  },
  tower: () => [part(new THREE.BoxGeometry(0.6, 1.5, 0.6), 0.75, 0, true), part(new THREE.BoxGeometry(0.66, 0.08, 0.66), 1.54, 0x2a2f38)],
  peak: () => [part(new THREE.ConeGeometry(2.2, 4.4, 6), 2.2, 0, true), part(new THREE.ConeGeometry(0.88, 1.76, 6), 3.52, 0xe9eef3)],
  rock: () => [part(new THREE.DodecahedronGeometry(0.35, 0), 0.15, 0, true)],
  cactus: () => {
    const arm = new THREE.CylinderGeometry(0.07, 0.07, 0.45, 6); arm.translate(0.2, 0.75, 0);
    return [part(new THREE.CylinderGeometry(0.11, 0.12, 1.2, 6), 0.6, 0, true), part(arm, 0, 0, true)];
  },
  reed: () => [-0.12, 0, 0.12].map((dx, k) => { const g = new THREE.CylinderGeometry(0.02, 0.03, 0.9 + k * 0.2, 4); g.translate(dx, 0, (k - 1) * 0.07); return part(g, 0.45, 0, true); }),
  boat: () => {
    const sail = new THREE.ConeGeometry(0.3, 0.8, 3); sail.scale(1, 1, 0.15);
    return [part(new THREE.BoxGeometry(1.0, 0.22, 0.4), 0.1, 0, true), part(new THREE.CylinderGeometry(0.02, 0.02, 0.9, 4), 0.6, 0x3a2c22), part(sail, 0.65, 0xeae4d6)];
  },
};
// each landscape: an icon, the ground colour, and its pieces: [piece, per chapter, nearest and
// farthest distance from the road, colours]
const LAND_LOOK = {
  forest: { icon: "🌲", ground: "#1d3a22", pieces: [["pine", 14, 2.6, 13, ["#2f6b3a", "#3d7f45", "#24552e"]], ["roundtree", 4, 2.8, 13, ["#3f7a3c", "#4f8a40"]]] },
  countryside: { icon: "🌾", ground: "#33532a", pieces: [["roundtree", 3, 2.8, 14, ["#4f8a40", "#5d9a48", "#6aa04e"]], ["bush", 5, 2.4, 14, ["#5a8f45", "#79a650"]], ["house", 1, 4, 12, ["#d8c9a8", "#e3d6b8"]]] },
  town: { icon: "🏘️", ground: "#34383f", pieces: [["house", 5, 2.6, 10, ["#b9a58a", "#9a8f86", "#c7b9a4", "#7f8a96"]], ["tower", 1, 6, 14, ["#8d96a3", "#a39b8f", "#6f7783"]]] },
  mountains: { icon: "⛰️", ground: "#4b463f", pieces: [["peak", 3, 7, 15, ["#6e6a63", "#5d5a55", "#7a7268"]], ["rock", 3, 2.6, 6, ["#7a756c", "#8a847a"]], ["pine", 2, 2.8, 7, ["#2f5a3a"]]] },
  desert: { icon: "🏜️", ground: "#8a7246", pieces: [["cactus", 2, 3, 13, ["#5f8a46", "#6e9a4f"]], ["rock", 3, 3, 14, ["#a0835a", "#8c6e48"]]] },
  water: { icon: "🌊", ground: "#0f2b40", pieces: [["boat", 1, 6, 14, ["#c9b28c", "#a2876a"]]] },
  marsh: { icon: "🪷", ground: "#2c3826", pieces: [["reed", 14, 2.4, 13, ["#7d8a4a", "#8f9455", "#6b7340"]], ["bush", 2, 3, 12, ["#4c5c35"]]] },
  snow: { icon: "❄️", ground: "#aeb9c4", pieces: [["snowpine", 6, 2.6, 13, ["#dfe8ef", "#c9d6e0", "#b5c6d3"]], ["rock", 2, 3, 13, ["#c0c8d0"]]] },
};

const ROUTE_ICONS = { straight: "🛣️", winding: "〰️", steep: "🧗" };
const WEATHER_ICONS = { storm: "⛈️", rain: "🌧️", snow: "🌨️", fog: "🌫️", wind: "🍃", sun: "☀️" };

/* ---- Story road ---- */
// The book as a journey: a road over a landscape. The road climbs where the
// story's (smoothed) mood is bright and dips into valleys where it turns dark.
// Signposts mark the turning points, gates mark where each act begins.
function road() {
  // every chapter gets the same stretch of road, so long books get a longer road (with room
  // for each chapter's landscape and weather). The opening view shows the first VIEW units of
  // it at the usual size; Travel and the chapter slider carry you along the rest.
  const n = data.chapters, PER_CHAPTER = 2.4, VIEW = 80;
  const LENGTH = Math.max(40, n * PER_CHAPTER), startX = Math.min(0, -LENGTH / 2 + VIEW / 2);
  const st = stage({ camera: [startX, 24, 35], autoRotate: false, fog: 0.008 });
  st.orbit.target.set(startX, 2, -1); st.orbit.maxPolarAngle = Math.PI * 0.47;  // never look from under the ground
  st.scene.add(new THREE.AmbientLight(0xffffff, 0.5), new THREE.HemisphereLight(0x9fd8ff, 0x1a1208, 0.6));
  const sun = new THREE.DirectionalLight(0xfff1d6, 1.5); sun.position.set(-20, 30, 15); st.scene.add(sun);

  const events = data.chapterEvents, details = data.chapterDetails, tone = data.chapterTone;
  const BASE = 3.2, RISE = 3.6, WIDTH = 0.95;
  // heights relative to this book: its brightest stretch is the highest hill
  const reach = Math.max(...data.arc.map(Math.abs)) || 1;
  const toneReach = Math.max(...tone.map(Math.abs)) || 1;
  const xOf = (t) => (t / Math.max(1, n - 1) - 0.5) * LENGTH;
  // the road's sideways shape, from the story's travel words (analyzer/route.py): nearly straight,
  // strongly winding, or zigzag switchbacks where the story climbs; gentle bends everywhere else
  const ROUTE_SHAPE = { straight: [0.1, 0.2, 0], winding: [1.6, 1.2, 0], steep: [0.75, 3.2, 1] };  // [bend size, bend speed, zigzag]
  const shapeOf = (i) => ROUTE_SHAPE[data.route[i]?.kind] || [1, 0.33, 0];
  const BEND = data.route.map((_, i) => shapeOf(i)[0]), ZIG = data.route.map((_, i) => shapeOf(i)[2]);
  const PHASE = [0];  // how far along its bends the road is at each chapter (so a change of speed never jumps)
  for (let i = 1; i < n; i++) PHASE.push(PHASE[i - 1] + (shapeOf(i - 1)[1] + shapeOf(i)[1]) / 2);
  const wave = (p, zig) => (1 - zig) * Math.sin(p) + zig * (2 / Math.PI) * Math.asin(Math.sin(p));  // smooth bends -> sharp zigzag
  const zOf = (t) => lerpAt(BEND, t) * wave(lerpAt(PHASE, t), lerpAt(ZIG, t)) * 3.2 + Math.sin(t * 0.09) * 2.5;
  const lerpAt = (values, t) => { const i = Math.max(0, Math.min(n - 1, Math.floor(t))), j = Math.min(n - 1, i + 1), f = t - i; return values[i] * (1 - f) + values[j] * f; };
  const hOf = (t) => BASE + (lerpAt(data.arc, t) / reach) * RISE;
  const colorOf = (t) => toneColor(lerpAt(tone, t), toneReach);
  const at = (t) => new THREE.Vector3(xOf(t), hOf(t), zOf(t));

  // the setting of each chapter (read from its descriptive words in analyzer/landscape.py):
  // the land beside the road takes that landscape's colour and shape, with scenery on it
  const LAND = data.landscape, KINDS = Object.keys(LAND_LOOK);
  // how much of each landscape is at a point along the road (0..1, blending between chapters)
  const share = Object.fromEntries(KINDS.map((k) => [k, LAND.map((l) => (l.kind === k ? 1 : 0))]));
  const landAt = (k, t) => lerpAt(share[k], t);
  const tOfX = (x) => Math.max(0, Math.min(n - 1, (x / LENGTH + 0.5) * (n - 1)));
  const bumps = (x, z) => 0.5 + 0.5 * Math.sin(x * 0.45 + Math.sin(z * 0.3) * 2) * Math.cos(z * 0.5 + x * 0.13);
  const WATER_Y = -1.0, W = LENGTH + 24, D = 36;
  function groundAt(x, z) {  // [height, how far from the road it is (1 = on the road, 0 = far)]
    const t = tOfX(x);
    const off = (x < -LENGTH / 2 ? -LENGTH / 2 - x : x > LENGTH / 2 ? x - LENGTH / 2 : 0);  // beyond the ends
    const fall = Math.exp(-((Math.hypot(z - zOf(t), off * 1.4) / 7.5) ** 2)), away = 1 - fall;
    let y = (hOf(t) - 0.12) * fall + 0.25 * Math.sin(x * 0.7) * Math.cos(z * 0.6) * away - 0.4;
    const edge = 1 - Math.min(1, Math.abs(z) / (D / 2)) ** 3;  // ...sinking again at the map's edge, so it ends without a wall
    y += landAt("mountains", t) * away * away * edge * (1 + 3 * bumps(x, z));  // high ground rising away from the road
    y += landAt("desert", t) * away * 0.5 * Math.sin(x * 0.35 + z * 0.2) ** 2;  // dunes
    const wet = landAt("water", t) * Math.min(1, away * 1.6), boggy = landAt("marsh", t) * away;
    y = y * (1 - wet) + (WATER_Y - 0.6) * wet;  // the land sinks under the water

    return `${LAND_LOOK[l.kind].icon} ${escape(data.landscapeLabels[l.kind])}${l.sure ? words : " (no clues here, same as before)"}${sky}${way}`;
  };
  function select(i) {
    const d = details[i], shares = data.chapterEmotions[i];
    card.hidden = false;
    card.innerHTML = `<h3>${describe(i)}</h3><div class="meta" style="color:var(--ink)">“${escape(events[i].event)}”</div>
      <div class="meta">mood ${fmtTone(tone[i])}${d.place ? " · at " + escape(d.place) : ""}<br>${setting(i)}<br>${people(d.people)}${standOut(data.chapterStandOut[i])}</div>
      ${shares.some((s) => s > 0) ? emotionBars(shares) : ""}`;
    slider.value = String(i + 1);
  }
  const hit = hover(st, () => [...walkers.filter((w) => w.sprite.visible).map((w) => w.sprite), ...hitBoxes], (h) => {
    if (h.object.userData.who != null) {
      const c = walkers[h.object.userData.who].c, ch = Math.round(pos);
      return `<b style="color:${c.color}">${avatarImg(c, 22)}${escape(c.name)}</b><br>${Math.round(c.presence[ch] * 100)}% of the character mentions around ${escape(data.chapterTitles[ch])}`;
    }
    const i = h.object.userData.ch;
    return `<b>${describe(i)}</b><br>mood ${fmtTone(tone[i])} · ${setting(i)}<br>${escape(events[i].event)}`;
  });

  hud.innerHTML = `<button id="go" type="button">▶ Travel</button><input id="seek" type="range" min="1" max="${n}" value="1" aria-label="Jump to chapter">
    <span class="chip">height = the story's mood · <span style="color:#f0d48a">▲</span> high points · <span style="color:#f09a9a">▼</span> low points · ⚔️ key themes · 😨 standout feelings · faces = who is in the story here · land = where it happens · sky = the weather · bends = straight, winding or climbing roads in the story</span>`;
  const go = document.getElementById("go"), slider = document.getElementById("seek");
  let travelling = false, pos = 0, last = 0;
  const place = (t) => { traveller.position.copy(at(t)).add(new THREE.Vector3(0, 0.45, 0)); };
  const stop = () => { travelling = false; go.textContent = "▶ Travel"; st.orbit.enabled = true; };
  const look = (t) => {  // a view from behind and above the traveller, looking down the road
    const p = at(t), ahead = at(Math.min(n - 1, t + 4));
    const back = p.clone().sub(ahead).setY(0).normalize();
    st.camera.position.copy(p).add(back.multiplyScalar(9)).add(new THREE.Vector3(0, 5.5, 0));
    st.orbit.target.copy(ahead).add(new THREE.Vector3(0, 0.5, 0)); st.camera.lookAt(st.orbit.target);
  };
  go.addEventListener("click", () => {
    if (travelling) { stop(); return; }
    travelling = true; st.orbit.enabled = false; go.textContent = "■ Stop"; if (pos >= n - 1) pos = 0;
    select(Math.round(pos));
  });
  slider.addEventListener("input", () => { pos = +slider.value - 1; stop(); place(pos); look(pos); select(pos); });
  canvas.addEventListener("click", (e) => { const [h] = hit(e); if (h && h.object.userData.ch != null) { stop(); pos = h.object.userData.ch; place(pos); select(pos); } });
  st.tick.push((t) => {
    const dt = Math.min(0.05, t - last); last = t;
    traveller.children[1].scale.setScalar(3 + Math.sin(t * 3) * 0.4);  // a gentle pulse
    walk(dt, t);
    if (!travelling) return;
    pos = Math.min(n - 1, pos + dt * (REDUCE ? 4 : 0.9));
    place(pos); look(pos);
    if (+slider.value !== Math.round(pos) + 1) select(Math.round(pos));
    if (pos >= n - 1) stop();
  });
  hint.textContent = "drag to rotate · click the road";
  place(0);  // the card opens once you click the road or travel, so it doesn't hide the start
}

/* ---- Character constellation ---- */
function constellation() {
  const st = stage({ camera: [9, 6, 15] });
  const norm = (vals) => { const lo = Math.min(...vals), hi = Math.max(...vals); return vals.map((v) => ((v - lo) / (hi - lo || 1)) * 10 - 5); };
  const when = chars.map((c) => { const tot = c.byChapter.reduce((a, b) => a + b, 0) || 1; return c.byChapter.reduce((a, n, i) => a + i * n, 0) / tot; });
  // warm families (love, joy, surprise) minus the others, looked up by name
  const warm = chars.map((c) => EMO.reduce((sum, e, k) => sum + (data.warm.includes(e) ? 1 : -1) * c.emotions[k], 0));
  const X = norm(chars.map((c) => c.sentiment)), Y = norm(when), Z = norm(warm);
  const pos = chars.map((_, i) => new THREE.Vector3(X[i], Y[i] * 0.8, Z[i]));
  const maxM = Math.max(...chars.map((c) => c.mentions));
  const stars = chars.map((c, i) => {
    const color = new THREE.Color(EMO_COLOR[standsOut(c.emotions)] || "#5ee7ff");
    const r = 0.18 + 0.55 * Math.sqrt(c.mentions / maxM);
    const ball = new THREE.Mesh(new THREE.SphereGeometry(r, 24, 16), new THREE.MeshBasicMaterial({ color }));
    ball.position.copy(pos[i]); ball.userData.i = i;
    const shell = new THREE.Mesh(new THREE.IcosahedronGeometry(r * 1.7, 1), new THREE.MeshBasicMaterial({ color: HOLO, wireframe: true, transparent: true, opacity: 0.18 }));
    shell.position.copy(pos[i]);
    const halo = glow(color, r * 7); halo.position.copy(pos[i]);
    const name = label(c.name, { size: 0.42, color: c.color }); name.position.copy(pos[i]).add(new THREE.Vector3(0, r + 0.45, 0));
    st.scene.add(ball, shell, halo, name);
    st.tick.push((t) => { shell.rotation.y = t * 0.4 + i; shell.rotation.x = t * 0.2; });
    return ball;
  });
  const maxL = Math.max(1, ...data.links.map((l) => l.count));
  const links = data.links.map((l) => {
    const m = new THREE.LineBasicMaterial({ color: toneColor(l.tone, 0.12), transparent: true, opacity: 0.15 + 0.6 * Math.sqrt(l.count / maxL) });
    const line = new THREE.Line(new THREE.BufferGeometry().setFromPoints([pos[l.a], pos[l.b]]), m);
    line.userData = { l, base: m.opacity }; st.scene.add(line); return line;
  });
  st.scene.add(grid(14, 14, -5.2));
  const axis = (text, p) => { const s = label(text, { size: 0.36, color: "#6c7d92", weight: 500 }); s.position.set(...p); st.scene.add(s); };
  axis("darker tone", [-6.6, -5, 0]); axis("brighter tone", [6.6, -5, 0]);
  axis("early in the book", [0, -4.6, -6.5]); axis("late in the book", [0, 4.8, 0]);
  axis("cold emotions", [0, -5, -7.4]); axis("warm emotions", [0, -5, 7.4]);

  card.hidden = false;
  function select(i) {
    const c = chars[i];
    links.forEach((line) => {
      const on = line.userData.l.a === i || line.userData.l.b === i;
      line.material.opacity = on ? Math.min(1, line.userData.base + 0.45) : 0.04;
    });
    const mine = data.links.filter((l) => l.a === i || l.b === i).sort((a, b) => b.count - a.count).slice(0, 3);
    card.innerHTML = `<h3 style="color:${c.color}">${avatarImg(c, 40)}${escape(c.name)}</h3><div class="meta">${c.mentions.toLocaleString()} mentions · tone ${fmtTone(c.sentiment)}${standOut(c.standOut)}</div>${emotionBars(c.emotions)}
      <div class="meta">${mine.length ? "Closest: " + mine.map((l) => `${escape(chars[l.a === i ? l.b : l.a].name)} (${l.count})`).join(", ") : "No strong relationships"}</div>`;
  }
  const hit = hover(st, () => stars, (h) => {
    const c = chars[h.object.userData.i], e = standsOut(c.emotions), k = EMO.indexOf(e);
    return `<b>${escape(c.name)}</b><br>${c.mentions.toLocaleString()} mentions<br>stands out: ${EMO_LABEL[e]} (${Math.round(c.emotions[k] * 100)}% vs ${Math.round(data.bookEmotions[k] * 100)}% in the book)<br>tone ${fmtTone(c.sentiment)}<br><span style="color:#6c7d92">click to select</span>`;
  });
  canvas.addEventListener("click", (e) => { const [h] = hit(e); if (h) select(h.object.userData.i); });
  hint.textContent = "drag to rotate · click a star";
  select(0);
}

/* ---- Emotion crystal ---- */
// One crystal that morphs from character to character: every part is built once,
// and on each change the spikes, core colour and ring glide to the new values.
function crystal() {
  const st = stage({ camera: [0, 4.5, 13], fog: 0.02 });
  const scan = new THREE.Mesh(new THREE.CylinderGeometry(5.6, 5.6, 0.04, 64, 1, true), new THREE.MeshBasicMaterial({ color: HOLO, transparent: true, opacity: 0.12, side: THREE.DoubleSide, blending: THREE.AdditiveBlending }));
  const base = new THREE.Mesh(new THREE.RingGeometry(5.3, 5.45, 96), new THREE.MeshBasicMaterial({ color: HOLO, transparent: true, opacity: 0.35, side: THREE.DoubleSide }));
  base.rotation.x = -Math.PI / 2; base.position.y = -3;
  st.scene.add(scan, base, glow(HOLO, 9));

  const group = new THREE.Group(); st.scene.add(group);
  // the core takes the character's own colour (the one it has in every chart)
  const core = new THREE.Mesh(new THREE.IcosahedronGeometry(0.85, 1), new THREE.MeshBasicMaterial({ color: HOLO.clone(), wireframe: true, transparent: true, opacity: 0.8 }));
  const aura = glow(HOLO.clone(), 4);
  group.add(core, aura);
  // one spike per emotion family: a cone 1 unit long, stretched to its length
  const UP = new THREE.Vector3(0, 1, 0);
  const spikes = EMO.map((e, k) => {
    const a = (k / EMO.length) * Math.PI * 2, dir = new THREE.Vector3(Math.cos(a), k % 2 ? 0.35 : -0.25, Math.sin(a)).normalize();
    const geo = new THREE.ConeGeometry(0.32, 1, 6); geo.translate(0, 0.5, 0);
    const holder = new THREE.Group(); holder.quaternion.setFromUnitVectors(UP, dir);
    holder.add(new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ color: EMO_COLOR[e], transparent: true, opacity: 0.55, depthWrite: false })),
               new THREE.LineSegments(new THREE.EdgesGeometry(geo), new THREE.LineBasicMaterial({ color: EMO_COLOR[e] })));
    group.add(holder);
    return { e, dir, holder, tip: null };
  });
  // the ring goes once round the book: up and blue in bright chapters, down and red in dark ones
  const n = data.chapters;
  const ringGeo = new THREE.BufferGeometry();
  ringGeo.setAttribute("position", new THREE.Float32BufferAttribute(new Float32Array(n * 3), 3));
  ringGeo.setAttribute("color", new THREE.Float32BufferAttribute(new Float32Array(n * 3), 3));
  group.add(new THREE.LineLoop(ringGeo, new THREE.LineBasicMaterial({ vertexColors: true })));
  const start = label("ch 1", { size: 0.32, color: "#6c7d92", weight: 500 }); start.position.set(5.9, -2.4, 0); group.add(start);
  let nameTag = null;
  const portrait = new THREE.Sprite(new THREE.SpriteMaterial({ transparent: true, depthWrite: false, opacity: 0 }));
  portrait.scale.setScalar(1.7); portrait.position.set(0, 4.5, 0); portrait.visible = false; st.scene.add(portrait);
  const portraits = {}, loader = new THREE.TextureLoader();
  const portraitOf = (c) => {
    if (!portraits[c.name]) { portraits[c.name] = loader.load(c.avatar); portraits[c.name].colorSpace = THREE.SRGBColorSpace; }
    return portraits[c.name];
  };

  // what the crystal should look like for one character
  const shapeOf = (c) => {
    const ring = smooth(c.toneByChapter, 2);
    return {
      lens: c.emotions.map((s) => 0.8 + s * 15),
      core: new THREE.Color(c.color),
      ys: ring.map((t) => -2.4 + (t ?? 0) * 7),
      cols: ring.flatMap((t) => toneColor(t, 0.12).toArray()),
    };
  };
  const mix = (a, b, f) => ({
    lens: a.lens.map((v, k) => v + (b.lens[k] - v) * f),
    core: a.core.clone().lerp(b.core, f),
    ys: a.ys.map((v, j) => v + (b.ys[j] - v) * f),
    cols: a.cols.map((v, j) => v + (b.cols[j] - v) * f),
  });
  const ease = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);  // slow, fast, slow
  const DURATION = REDUCE ? 0 : 1600;  // ms for one change
  let from = null, to = null, now = null, began = 0;

  function show(s) {
    spikes.forEach((sp, k) => {
      sp.holder.scale.y = s.lens[k];
      if (sp.tip) sp.tip.position.copy(sp.dir).multiplyScalar(s.lens[k] + 0.7);
    });
    core.material.color.copy(s.core); aura.material.color.copy(s.core);
    const pos = ringGeo.attributes.position, col = ringGeo.attributes.color;
    s.ys.forEach((y, j) => {
      const a = (j / n) * Math.PI * 2;
      pos.setXYZ(j, Math.cos(a) * 5.4, y, Math.sin(a) * 5.4);
      col.setXYZ(j, s.cols[j * 3], s.cols[j * 3 + 1], s.cols[j * 3 + 2]);
    });
    pos.needsUpdate = true; col.needsUpdate = true;
  }

  function build(i) {
    const c = chars[i];
    to = shapeOf(c);
    // start from wherever the crystal is right now (even halfway through a change);
    // the very first time it grows out of a small seed
    from = now || { lens: EMO.map(() => 0.8), core: HOLO.clone(), ys: to.ys.map(() => -2.4), cols: to.cols.slice() };
    began = performance.now();
    spikes.forEach((sp, k) => {  // the percentages move with their spikes
      if (sp.tip) group.remove(sp.tip);
      sp.tip = label(`${EMO_LABEL[sp.e]} ${Math.round(c.emotions[k] * 100)}%`, { size: 0.36 });
      group.add(sp.tip);
    });
    if (nameTag) st.scene.remove(nameTag);  // the name floats above the crystal, in the character's colour
    nameTag = label(c.name, { size: 0.9, color: c.color, weight: 600 });
    nameTag.position.set(0, 3.35, 0); nameTag.material.opacity = 0; st.scene.add(nameTag);
    portrait.visible = !!c.avatar;
    if (c.avatar) { portrait.material.map = portraitOf(c); portrait.material.needsUpdate = true; }
    const present = c.toneByChapter.map((t, j) => [t, j]).filter(([t]) => t != null);
    const bright = present.reduce((b, x) => (x[0] > b[0] ? x : b), present[0] || [0, 0]);
    const dark = present.reduce((b, x) => (x[0] < b[0] ? x : b), present[0] || [0, 0]);
    card.hidden = false;
    card.innerHTML = `<h3 style="color:${c.color}">${avatarImg(c, 40)}${escape(c.name)}</h3><div class="meta">${c.mentions.toLocaleString()} mentions · tone ${fmtTone(c.sentiment)}<br>brightest: ${escape(data.chapterTitles[bright[1]])}<br>darkest: ${escape(data.chapterTitles[dark[1]])}${standOut(c.standOut)}</div>${emotionBars(c.emotions)}`;
  }

  st.tick.push((t) => {
    if (!to) return;
    const elapsed = performance.now() - began;
    if (!now || elapsed < DURATION + 50) {  // only work while something is changing
      now = mix(from, to, DURATION ? ease(Math.min(1, elapsed / DURATION)) : 1);
      show(now);
    }
    if (nameTag) nameTag.material.opacity = portrait.material.opacity = DURATION ? Math.min(1, elapsed / 600) : 1;
    group.rotation.y = REDUCE ? 0 : t * 0.25;
    scan.position.y = REDUCE ? 0 : Math.sin(t * 0.9) * 3;
  });
  picker("Character", chars.map((c) => c.name), build);
  // Play through the characters on its own, one every 5 seconds, until the
  // visitor reaches for the drop-down: from then on they're in charge.
  const select = document.getElementById("pick");
  let autoplay = chars.length > 1, shown = 0, visible = true;
  new IntersectionObserver(([entry]) => { visible = entry.isIntersecting; }).observe(canvas);
  const stopAutoplay = () => { autoplay = false; hint.textContent = "drag to rotate"; };
  ["pointerdown", "focus", "keydown"].forEach((ev) => select.addEventListener(ev, stopAutoplay, { once: true }));
  setInterval(() => {
    if (!autoplay || !visible || document.hidden) return;  // no work while nobody can see it
    shown = (shown + 1) % chars.length;
    select.value = String(shown);  // the list follows along (this doesn't count as the visitor choosing)
    build(shown);
  }, 5000);
  if (autoplay) hint.textContent = "a new character every 5 s · pick one to stop";
}

({ road, constellation, crystal })[SCENE]();
window.sceneStarted = true;
</script>
